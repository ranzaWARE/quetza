name: App Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'backend/public/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  # L'interfaccia dell'app è backend/public, copiata nell'APK
  pull_request:
    paths: ['android/**', 'backend/public/**', '.github/workflows/android.yml']
  # Ogni modifica all'app su main pubblica da sola la release android-v<versione>
  # (patch successiva; vedi .github/scripts/prossima-versione.sh). Da Actions ›
  # App Android › Run workflow si può forzare una versione (es. 2.0.0).
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da pubblicare (vuoto = la successiva, se l''app è cambiata)'
        required: false
        default: ''

permissions:
  contents: write

# Due release di fila non devono calcolare la stessa versione
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Il keystore di firma è un segreto del repository (vedi android/README.md).
      # Senza, si pubblica solo l'APK debug.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUETZA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quetza.jks"
            echo "QUETZA_KEYSTORE=$RUNNER_TEMP/quetza.jks" >> "$GITHUB_ENV"
          fi

      # Versione: quella dell'avvio manuale o del tag, se no la successiva
      # all'ultima release. La base (per una minore o una maggiore) è il
      # versionName in app/build.gradle.kts.
      - name: Versione
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          VERSIONE: ${{ inputs.versione || (startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || '') }}
          NOTE_EXTRA: "Scarica l'APK qui sotto e installalo sul dispositivo: `quetza.apk` è firmato, `quetza-debug.apk` serve per le prove."
        run: |
          BASE=$(sed -n 's/.*QUETZA_VERSION_NAME") ?: "\([0-9.]*\)".*/\1/p' android/app/build.gradle.kts)
          .github/scripts/prossima-versione.sh android-v "${BASE:-1.0.0}" android backend/public ':(exclude)*.md'

      - name: Versione di prova
        if: github.event_name == 'pull_request'
        run: echo "QUETZA_VERSION_NAME=0.0.${{ github.run_number }}-pr${{ github.event.number }}" >> "$GITHUB_ENV"

      - name: Numero di build
        run: |
          echo "QUETZA_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          [ -z "$V" ] || echo "QUETZA_VERSION_NAME=$V" >> "$GITHUB_ENV"

      - name: Build
        env:
          QUETZA_KEYSTORE_PASSWORD: ${{ secrets.QUETZA_KEYSTORE_PASSWORD }}
          QUETZA_KEY_ALIAS: ${{ secrets.QUETZA_KEY_ALIAS }}
          QUETZA_KEY_PASSWORD: ${{ secrets.QUETZA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$QUETZA_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease
            cp app/build/outputs/apk/release/app-release.apk quetza.apk
          else
            ./gradlew --no-daemon assembleDebug
          fi
          cp app/build/outputs/apk/debug/app-debug.apk quetza-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quetza-android
          path: android/quetza*.apk

      - name: Release
        if: env.PUBBLICA == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Quetza per Android ${{ env.V }}
          body_path: ${{ runner.temp }}/note.md
          files: android/quetza*.apk
          make_latest: false
