# Release del server: crea il tag v<versione> e la release su GitHub.
# Parte da sola a ogni modifica del server su main con la patch successiva
# (1.1.0 → 1.1.1 → …); per una minore o una maggiore si alza `version` in
# backend/package.json. Le note sono docs/note-di-versione/v<versione>.md se
# c'è, se no l'elenco delle modifiche. Da Actions (workflow_dispatch) si può
# forzare una versione. Prima rifà i test. Vedi .github/scripts/prossima-versione.sh.
name: Release

on:
  push:
    branches: [main]
    paths: ['backend/**', '!backend/tests/**', 'whisper/**', 'nginx/**', 'docker-compose.yml', 'installa.sh', '.env.example']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da pubblicare (vuoto = la successiva, se il server è cambiato)'
        required: false
        default: ''

permissions:
  contents: write

# Due release di fila non devono calcolare la stessa versione
concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Versione e note
        env:
          VERSIONE: ${{ inputs.versione || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
          NOTE_EXTRA: "Aggiornare: `docker exec quetza node /app/backup.js`, poi `git pull` e `./installa.sh`. App Android: [release android-v*](https://github.com/${{ github.repository }}/releases?q=android-v&expanded=true)."
        run: |
          .github/scripts/prossima-versione.sh v "$(node -p "require('./backend/package.json').version")" \
            backend ':(exclude)backend/tests' ':(exclude)*.md' whisper nginx docker-compose.yml installa.sh .env.example
      - name: Test
        if: env.PUBBLICA == 'si'
        working-directory: backend
        run: npm ci && npm test
      - uses: softprops/action-gh-release@v2
        if: env.PUBBLICA == 'si'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Quetza ${{ env.V }}
          body_path: ${{ runner.temp }}/note.md
          make_latest: true
