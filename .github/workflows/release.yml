# Release del server: crea il tag v<versione> e la release su GitHub con le
# note in docs/note-di-versione/v<versione>.md. Si lancia da Actions
# (workflow_dispatch) o spingendo un tag v*. Prima rifà i test, e la
# versione deve coincidere con backend/package.json.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da pubblicare (es. 1.0.0): tag v<versione> sul commit scelto'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Test
        working-directory: backend
        run: npm ci && npm test
      - name: Versione e note
        env:
          VERSIONE: ${{ inputs.versione }}
        run: |
          V="${VERSIONE:-${GITHUB_REF_NAME#v}}"
          P=$(node -p "require('./backend/package.json').version")
          [ "$V" = "$P" ] || { echo "::error::La versione $V non coincide con backend/package.json ($P)"; exit 1; }
          NOTE="docs/note-di-versione/v$V.md"
          [ -f "$NOTE" ] || { echo "::error::Mancano le note di versione in $NOTE"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          echo "NOTE=$NOTE" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Quetza ${{ env.V }}
          body_path: ${{ env.NOTE }}
          make_latest: true
