<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quetza">
<meta name="theme-color" content="#f3ead8">

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Quetza — Accesso</title>
<script>
  (function(){
    try{
      var t = localStorage.getItem('auror-theme');
      if(!t){ t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      if(t === 'dark' || t === 'eink') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; height: 100%; }
  body{
    font-family: var(--auror-font);
    background: var(--surface);
    color: var(--text);
    font-size: var(--auror-fs-14);
    line-height: var(--auror-lh-body);
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  a{ color: var(--accent); text-decoration: none; }
  a:hover{ text-decoration: underline; }

  .topRail{
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topBrand{
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 13px; letter-spacing: 0.02em;
    color: var(--text);
  }
  .topBrand .mark{
    width: 24px; height: 24px;
    border-radius: var(--auror-r);
    background: var(--accent);
    color: var(--text-on-accent);
    display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .topBrand .mark svg{ width: 18px; height: auto; }

  .iconBtn{
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--auror-r);
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background var(--auror-dur-base) var(--auror-ease);
  }
  .iconBtn:hover{ background: var(--surface-sunken); color: var(--text); }
  .iconBtn svg{ width: 16px; height: 16px; }
  .iconBtn .ic-moon,.iconBtn .ic-eink{ display: none; }
  [data-theme="dark"] .iconBtn .ic-sun{ display: none; }
  [data-theme="dark"] .iconBtn .ic-moon{ display: block; }
  [data-theme="eink"] .iconBtn .ic-sun{ display: none; }
  [data-theme="eink"] .iconBtn .ic-eink{ display: block; }

  .pageWrap{
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 80px 20px 40px;
  }
  .loginCard{
    width: 100%; max-width: 400px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--auror-r);
    box-shadow: var(--shadow-md);
    padding: 28px 24px 20px;
  }
  .cardHead{ text-align: center; margin-bottom: 22px; }
  .cardHead .bigMark{
    width: 44px; height: 44px;
    border-radius: var(--auror-r);
    background: var(--accent);
    color: var(--text-on-accent);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .cardHead .bigMark svg{ width: 32px; height: auto; }
  .cardHead h1{
    margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--text);
  }
  .cardHead .sub{ margin: 0; color: var(--text-muted); font-size: 13px; }

  .methods{
    display: flex; gap: 4px;
    background: var(--surface-sunken);
    border-radius: var(--auror-r);
    padding: 4px;
    margin-bottom: 18px;
  }
  .methodBtn{
    flex: 1;
    background: transparent; border: none;
    padding: 7px 10px;
    border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: background var(--auror-dur-base) var(--auror-ease),
                color var(--auror-dur-base) var(--auror-ease);
  }
  .methodBtn:hover{ color: var(--text); }
  .methodBtn.active{
    background: var(--surface-raised);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(17,24,39,.05);
  }

  .formPane{ display: none; }
  .formPane.active{ display: block; }
  .field{ margin-bottom: 12px; }
  .field label{ display: block; margin-bottom: 5px; }
  /* Use .aurorInput and .aurorBtn.primary from components.css */
  .aurorInput{ height: auto; padding: 9px 12px; font-size: 14px; }
  .aurorBtn.primary{ width: 100%; padding: 11px 14px; font-size: 14px; justify-content: center; margin-top: 4px; }

  .infoNote{
    background: var(--surface-sunken);
    border: 1px solid var(--border-soft);
    border-radius: var(--auror-r);
    padding: 11px 13px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .infoNote strong{ color: var(--text); font-weight: 600; }

  .err{
    display: none;
    background: rgba(185,28,28,.08);
    border: 1px solid var(--danger-soft);
    color: var(--danger);
    border-radius: var(--auror-r);
    padding: 7px 11px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .err.show{ display: block; }

  .footer{
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .versionBar{
    text-align: center;
    padding: 14px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .versionBar a{ color: inherit; }
</style>
</head>
<body>

<div class="topRail">
  <div class="topBrand">
    <span class="mark">
      <svg viewBox="0 0 37 33" aria-hidden="true"><path fill="currentColor" d="M23 0h2v1h-2zM22 1h4v1h-4zM21 2h2v1h-2zM24 2h3v1h-3zM21 3h8v1h-8zM20 4h11v1h-11zM20 5h13v1h-13zM19 6h3v1h-3zM25 6h9v1h-9zM18 7h3v1h-3zM28 7h7v1h-7zM17 8h3v1h-3zM31 8h5v1h-5zM16 9h3v1h-3zM34 9h3v1h-3zM1 10h1v1h-1zM15 10h3v1h-3zM2 11h2v1h-2zM14 11h3v1h-3zM3 12h2v1h-2zM13 12h3v1h-3zM4 13h2v1h-2zM11 13h4v1h-4zM5 14h11v1h-11zM5 15h11v1h-11zM4 16h11v1h-11zM3 17h12v1h-12zM2 18h12v1h-12zM0 19h13v1h-13zM4 20h3v1h-3zM10 20h4v1h-4zM4 21h1v1h-1zM6 21h2v1h-2zM10 21h5v1h-5zM4 22h1v1h-1zM6 22h2v1h-2zM11 22h4v1h-4zM5 23h1v1h-1zM7 23h2v1h-2zM11 23h2v1h-2zM14 23h2v1h-2zM5 24h1v1h-1zM7 24h2v1h-2zM12 24h1v1h-1zM14 24h2v1h-2zM4 25h1v1h-1zM7 25h2v1h-2zM12 25h1v1h-1zM14 25h2v1h-2zM4 26h1v1h-1zM6 26h2v1h-2zM12 26h1v1h-1zM14 26h2v1h-2zM4 27h1v1h-1zM6 27h2v1h-2zM12 27h1v1h-1zM14 27h2v1h-2zM3 28h1v1h-1zM6 28h2v1h-2zM12 28h1v1h-1zM14 28h2v1h-2zM3 29h1v1h-1zM6 29h2v1h-2zM12 29h1v1h-1zM14 29h2v1h-2zM3 30h1v1h-1zM6 30h2v1h-2zM12 30h1v1h-1zM14 30h2v1h-2zM3 31h1v1h-1zM6 31h2v1h-2zM12 31h1v1h-1zM14 31h2v1h-2zM2 32h3v1h-3zM6 32h4v1h-4zM11 32h2v1h-2zM14 32h4v1h-4z"/></svg>
    </span>
    <span>Quetza</span>
  </div>
  <button class="iconBtn" type="button" id="themeToggle" aria-label="Cambia tema">
    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z"/></svg>
    <svg class="ic-eink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
  </button>
</div>

<div class="pageWrap">
  <div class="loginCard">

    <div class="cardHead">
      <div class="bigMark">
        <svg viewBox="0 0 37 33" aria-hidden="true"><path fill="currentColor" d="M23 0h2v1h-2zM22 1h4v1h-4zM21 2h2v1h-2zM24 2h3v1h-3zM21 3h8v1h-8zM20 4h11v1h-11zM20 5h13v1h-13zM19 6h3v1h-3zM25 6h9v1h-9zM18 7h3v1h-3zM28 7h7v1h-7zM17 8h3v1h-3zM31 8h5v1h-5zM16 9h3v1h-3zM34 9h3v1h-3zM1 10h1v1h-1zM15 10h3v1h-3zM2 11h2v1h-2zM14 11h3v1h-3zM3 12h2v1h-2zM13 12h3v1h-3zM4 13h2v1h-2zM11 13h4v1h-4zM5 14h11v1h-11zM5 15h11v1h-11zM4 16h11v1h-11zM3 17h12v1h-12zM2 18h12v1h-12zM0 19h13v1h-13zM4 20h3v1h-3zM10 20h4v1h-4zM4 21h1v1h-1zM6 21h2v1h-2zM10 21h5v1h-5zM4 22h1v1h-1zM6 22h2v1h-2zM11 22h4v1h-4zM5 23h1v1h-1zM7 23h2v1h-2zM11 23h2v1h-2zM14 23h2v1h-2zM5 24h1v1h-1zM7 24h2v1h-2zM12 24h1v1h-1zM14 24h2v1h-2zM4 25h1v1h-1zM7 25h2v1h-2zM12 25h1v1h-1zM14 25h2v1h-2zM4 26h1v1h-1zM6 26h2v1h-2zM12 26h1v1h-1zM14 26h2v1h-2zM4 27h1v1h-1zM6 27h2v1h-2zM12 27h1v1h-1zM14 27h2v1h-2zM3 28h1v1h-1zM6 28h2v1h-2zM12 28h1v1h-1zM14 28h2v1h-2zM3 29h1v1h-1zM6 29h2v1h-2zM12 29h1v1h-1zM14 29h2v1h-2zM3 30h1v1h-1zM6 30h2v1h-2zM12 30h1v1h-1zM14 30h2v1h-2zM3 31h1v1h-1zM6 31h2v1h-2zM12 31h1v1h-1zM14 31h2v1h-2zM2 32h3v1h-3zM6 32h4v1h-4zM11 32h2v1h-2zM14 32h4v1h-4z"/></svg>
      </div>
      <h1>Accedi a Quetza</h1>
      <p class="sub" id="orgName">Note a mano con audio</p>
    </div>

    <div class="methods" id="methodTabs" role="tablist" style="display:none">
      <button class="methodBtn active" data-method="local" type="button">Locale</button>
      <button class="methodBtn" data-method="oidc" type="button">SSO</button>
      <button class="methodBtn" data-method="ldap" type="button">LDAP</button>
    </div>

    <div class="err" id="errBanner">Credenziali non valide.</div>

    <!-- Locale -->
    <form class="formPane active" id="form-local" autocomplete="on">
      <div class="field">
        <label for="u">Username</label>
        <input class="aurorInput" type="text" id="u" autocomplete="username" placeholder="nome.cognome" required autofocus>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input class="aurorInput" type="password" id="p" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="aurorBtn primary" type="submit" id="btn">Accedi</button>
    </form>

    <!-- OIDC -->
    <form class="formPane" id="form-oidc">
      <div class="infoNote">
        Single sign-on aziendale.<br>
        Verrai reindirizzato al provider per autenticarti.
      </div>
      <button class="aurorBtn primary" type="submit">Accedi con SSO</button>
    </form>

    <!-- LDAP -->
    <form class="formPane" id="form-ldap" autocomplete="on">
      <div class="infoNote">
        Autenticazione via directory LDAP aziendale.
      </div>
      <div class="field">
        <label for="ldapUser">Username</label>
        <input class="aurorInput" type="text" id="ldapUser" placeholder="DOMAIN\\user o user@domain" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="ldapPwd">Password</label>
        <input class="aurorInput" type="password" id="ldapPwd" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="aurorBtn primary" type="submit">Accedi via LDAP</button>
    </form>

    <div class="footer">Usa le credenziali aziendali</div>
  </div>
</div>

<div class="versionBar">Quetza<span id="orgBar"></span> · <a href="/guida.html" target="_blank" rel="noopener">Guida</a></div>

<script>
  // Theme toggle
  (function(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var order = ['light', 'dark', 'eink'];
      var cur = document.documentElement.getAttribute('data-theme') || 'light';
      var next = order[(order.indexOf(cur) + 1) % order.length];
      if (next === 'light') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('auror-theme', next); }catch(e){}
    });
  })();

  // Method tabs — shown only when OIDC or LDAP is enabled
  (function(){
    var btns = document.querySelectorAll('.methodBtn');
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        btns.forEach(function(x){ x.classList.remove('active'); });
        document.querySelectorAll('.formPane').forEach(function(p){ p.classList.remove('active'); });
        b.classList.add('active');
        var pane = document.getElementById('form-' + b.getAttribute('data-method'));
        if(pane) pane.classList.add('active');
        document.getElementById('errBanner').classList.remove('show');
      });
    });
  })();

  // Load config
  async function init() {
    try {
      const r = await fetch('/api/login-config');
      if (r.ok) {
        const cfg = await r.json();
        var hasExtra = cfg.oidc_enabled || cfg.ldap_enabled;
        if (hasExtra) {
          document.getElementById('methodTabs').style.display = 'flex';
          if (!cfg.oidc_enabled) {
            document.querySelector('[data-method="oidc"]').style.display = 'none';
          }
          if (!cfg.ldap_enabled) {
            document.querySelector('[data-method="ldap"]').style.display = 'none';
          }
        }
        if (cfg.hint) document.querySelector('.footer').textContent = cfg.hint;
        if (cfg.org_name) {
          document.getElementById('orgName').textContent = cfg.org_name;
          document.getElementById('orgBar').textContent = ' · ' + cfg.org_name;
        }
      }
    } catch {}
  }

  // Local login
  document.getElementById('form-local').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('btn');
    var err = document.getElementById('errBanner');
    btn.disabled = true; err.classList.remove('show');
    try {
      // method:'local' forza l'autenticazione sull'account locale anche quando
      // LDAP è attivo — senza, il tab "Locale" veniva comunque instradato su LDAP
      // e l'admin locale diventava irraggiungibile se l'AD non rispondeva.
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value, method: 'local' })
      });
      var d = await r.json();
      if (r.ok) window.location.href = '/';
      else { err.textContent = d.error || 'Credenziali non valide'; err.classList.add('show'); }
    } catch { err.textContent = 'Errore di rete'; err.classList.add('show'); }
    finally { btn.disabled = false; }
  });

  // OIDC
  document.getElementById('form-oidc').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Reindirizzamento…';
    fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: '__oidc__', password: '__oidc__' })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.redirect) window.location.href = d.redirect;
    }).catch(function(){ btn.disabled = false; btn.textContent = 'Accedi con SSO'; });
  });

  // LDAP
  document.getElementById('form-ldap').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = e.target.querySelector('button');
    var err = document.getElementById('errBanner');
    btn.disabled = true; err.classList.remove('show');
    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: document.getElementById('ldapUser').value.trim(), password: document.getElementById('ldapPwd').value, method: 'ldap' })
      });
      var d = await r.json();
      if (r.ok) window.location.href = '/';
      else { err.textContent = d.error || 'Credenziali non valide'; err.classList.add('show'); }
    } catch { err.textContent = 'Errore di rete'; err.classList.add('show'); }
    finally { btn.disabled = false; }
  });

  // Errore tornato dal callback OIDC (/auth/callback) — prima non veniva mai
  // letto: un SSO fallito faceva ricomparire il form di login senza alcun
  // messaggio, come se non fosse successo nulla.
  (function(){
    var err = new URLSearchParams(location.search).get('error');
    if (!err) return;
    var msgs = {
      invalid_state: 'Sessione scaduta o non valida — riprova ad accedere con SSO.',
      oidc_failed: 'Accesso SSO non riuscito. Controlla la configurazione del provider o riprova.',
    };
    // Il click sul tab SSO nasconde il banner (vedi handler sopra): va fatto
    // prima di mostrare il messaggio, non dopo, altrimenti lo cancella subito.
    var ssoBtn = document.querySelector('[data-method="oidc"]');
    if (ssoBtn) ssoBtn.click();
    var banner = document.getElementById('errBanner');
    banner.textContent = msgs[err] || 'Accesso non riuscito.';
    banner.classList.add('show');
    // Rimuove il parametro dall'URL per non ripresentare l'errore a un refresh
    history.replaceState(null, '', location.pathname);
  })();

  init();
</script>
</body>
</html>
