server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/quetza.crt;
    ssl_certificate_key /etc/nginx/certs/quetza.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 250M;

    location / {
        # L'app termina il TLS da sé sulla 3443; la 3000 serve solo il redirect
        # verso HTTPS, quindi puntarla da qui creava un ciclo di redirect.
        # Il certificato interno è self-signed: verifica disattivata a monte.
        proxy_pass              https://quetza:3443;
        proxy_ssl_verify        off;
        proxy_ssl_server_name   on;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Necessario al rate limiter dell'app per distinguere i client
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;

        # WebSocket / upgrade (non usati oggi, ma innocui e pronti)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
