# Quetza — installazione con Docker Compose.
#
#   ./installa.sh            (crea .env con i segreti e avvia tutto)
#   oppure: cp .env.example .env, compila, docker compose up -d --build
#
# Tutta la configurazione sta in .env: questo file non va modificato e non
# contiene segreti.

services:

  quetza:
    build: ./backend
    image: quetza:local
    container_name: quetza
    restart: unless-stopped
    ports:
      - "${QUETZA_HTTP_PORT:-8080}:3000"
      - "${QUETZA_HTTPS_PORT:-8443}:3443"
    # Facoltativo: DNS interno (es. il domain controller) per risolvere i nomi
    # di LDAP o del provider SSO, se il resolver di Docker non li trova.
    # Vuoto = DNS dell'host.
    dns: ${DNS_SERVER:-}
    volumes:
      - quetza_data:/app/data
      # Certificato HTTPS: server.crt + server.key. Se mancano viene generato
      # un self-signed al primo avvio.
      - ./certs:/app/certs
      # Backup notturni del DB: copiali anche fuori dal server (NAS, nastro…).
      - ${BACKUP_PATH:-./backups}:/app/backups
      # Facoltativo: seconda copia di ogni backup su un'altra macchina (cartella
      # del NAS montata sul server, vedi BACKUP_COPY_PATH nel .env).
      - ${BACKUP_COPY_PATH:-./backups}:/app/backups-copy
      # Facoltativo: CA aziendale che firma LDAPS o il provider SSO (*.crt / *.pem).
      - ./ca:/app/ca:ro
      # Facoltativo: logo aziendale nell'intestazione (logo.svg, .png, .webp o .jpg).
      - ./logo:/app/public/assets:ro
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/quetza.db
      SESSION_SECRET: "${SESSION_SECRET:?manca SESSION_SECRET nel file .env, esegui ./installa.sh o leggi il README}"
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
      SERVER_NAME: ${SERVER_NAME:-}
      ORG_NAME: ${ORG_NAME:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUBLIC_HTTPS_PORT: ${QUETZA_HTTPS_PORT:-8443}
      ALLOW_HTTP: ${ALLOW_HTTP:-false}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-1024}
      TRASH_DAYS: ${TRASH_DAYS:-30}
      BACKUP_CRON: "${BACKUP_CRON:-0 2 * * *}"
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      BACKUP_COPY_DIR: ${BACKUP_COPY_PATH:+/app/backups-copy}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-}
      WHISPER_URL: http://quetza-whisper:9876
      WHISPER_TIMEOUT_MIN: ${WHISPER_TIMEOUT_MIN:-60}
    depends_on:
      quetza-whisper:
        condition: service_started
        required: false

  quetza-whisper:
    build: ./whisper
    image: quetza-whisper:local
    container_name: quetza-whisper
    restart: unless-stopped
    # Nessuna porta esposta: lo raggiunge solo Quetza sulla rete interna.
    # Al primo avvio scarica il modello da huggingface.co (serve Internet).
    dns: ${DNS_SERVER:-}
    volumes:
      - whisper_models:/app/models
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      HF_TOKEN: ${HF_TOKEN:-}
      LANGUAGE: ${LANGUAGE:-it}
    healthcheck:
      # L'immagine python:slim non ha curl: prima il check falliva sempre e il
      # container restava "unhealthy".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9876/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # il primo download del modello può richiedere minuti
    deploy:
      resources:
        limits:
          memory: ${WHISPER_MEMORY:-6G}

  # Reverse proxy facoltativo su 80/443 (al posto delle porte di Quetza).
  #   docker compose --profile nginx up -d
  # Con nginx imposta TRUST_PROXY=1 nel .env.
  nginx:
    profiles: ["nginx"]
    build: ./nginx
    container_name: quetza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - quetza

volumes:
  quetza_data:       # DB con note, audio, utenti e impostazioni: è il dato da proteggere
  whisper_models:    # modelli scaricati, persistiti tra i riavvii
  nginx_certs:
