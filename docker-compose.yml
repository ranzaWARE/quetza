services:

  quetza:
    # Build dal sorgente locale: prima puntava a
    # https://github.com/ranzaWARE/quetza.git#main:backend, quindi qualsiasi
    # modifica locale veniva ignorata e si ricostruiva sempre il main remoto.
    build: ./backend
    container_name: quetza
    restart: unless-stopped
    ports:
      - "8081:3000"
      - "8444:3443"
    volumes:
      - quetza_data:/app/data
      - quetza_certs:/app/certs
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/quetza.db
      # Generato con `openssl rand -hex 32`. Cambiala prima di andare in
      # produzione: invalida tutte le sessioni, quindi va fatto in una
      # finestra di manutenzione.
      - SESSION_SECRET=3f6be300f39a0a7b8ed6130e4c9e7dfc9cd3dc8b3a9998840110a32bc7c34e48
      - SERVER_IP=127.0.0.1
      # Numero di reverse proxy davanti all'app (0 = nessuno).
      # Serve al rate limiter per distinguere gli IP reali dei client.
      - TRUST_PROXY=1
      - LDAP_ENABLED=false
      - LDAP_URL=ldap://192.168.1.10:389
      - LDAP_BIND_DN=CN=svc_quetza,OU=ServiceAccounts,DC=graphimecc,DC=local
      - LDAP_BIND_PASSWORD=
      - LDAP_SEARCH_BASE=DC=graphimecc,DC=local
      - LDAP_SEARCH_FILTER=(sAMAccountName={{username}})
      - LDAP_TLS_REJECT_UNAUTHORIZED=false
      # URL interno del servizio Whisper
      - WHISPER_URL=http://quetza-whisper:9876
    depends_on:
      quetza-whisper:
        condition: service_healthy
        required: false

  quetza-whisper:
    build:
      context: ./whisper
    container_name: quetza-whisper
    restart: unless-stopped
    # Nessuna porta esposta all'esterno — solo rete interna Docker
    # DNS espliciti: il resolver embedded di Docker a volte non risolve host
    # esterni (es. huggingface.co) anche quando l'host li raggiunge — causa
    # comune di "cannot find the requested files in the local cache" al primo
    # download del modello di diarizzazione.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - whisper_models:/app/models
    environment:
      - WHISPER_MODEL=small
      - HF_TOKEN=
      - LANGUAGE=it
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # i modelli possono richiedere tempo al primo avvio
    # Limita RAM per non soffocare il server
    deploy:
      resources:
        limits:
          memory: 6G

  # Reverse proxy opzionale, se si preferisce terminare il TLS su nginx
  # invece che direttamente in Node. Prima la cartella nginx/ esisteva ma
  # non era referenziata da nessun servizio.
  #   docker compose --profile nginx up -d
  nginx:
    profiles: ["nginx"]
    build:
      context: ./nginx
    container_name: quetza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_IP=127.0.0.1
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - quetza

volumes:
  quetza_data:
  quetza_certs:
  whisper_models:    # modelli persistiti tra restart
  nginx_certs:
